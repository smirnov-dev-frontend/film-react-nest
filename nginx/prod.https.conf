server {
    listen 80;
    server_name film-smirnov.students.nomorepartiessite.ru api.film-smirnov.students.nomorepartiessite.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name film-smirnov.students.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film-smirnov.students.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film-smirnov.students.nomorepartiessite.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name api.film-smirnov.students.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film-smirnov.students.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film-smirnov.students.nomorepartiessite.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
